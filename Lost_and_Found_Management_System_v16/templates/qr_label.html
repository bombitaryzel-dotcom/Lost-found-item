{% extends 'base.html' %}{% block title %}QR Label{% endblock %}{% block content %}<section class="print-sheet"><img class="print-logo" src="{{ url_for('static', filename='img/sfxc-crest.jpg') }}" alt="School crest"><div><small>{{ school_name }}</small><h1>Lost & Found Item</h1><p>{{ item.title }}</p><code>{{ item.public_reference }}</code></div><img class="qr-image" src="{{ url_for('item_qr', item_id=item.id) }}" alt="Tracking QR code"><p class="print-note">Scan to view the public item record. Return this item to the Lost and Found Office.</p><button class="button primary no-print" type="button" data-print>Print Label</button></section>{% endblock %}
